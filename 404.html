<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halaman Tidak Ditemukan — Jatimulya Residence</title>
<link rel="icon" href="/wp-content/uploads/2026/11/favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
    background: #FAF7F2;
    color: #2E2A26;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.75;
  }
  .jr-404 {
    max-width: 560px;
    text-align: center;
  }
  .jr-404 .code {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 96px;
    line-height: 1;
    color: #A64B2A;
    letter-spacing: 4px;
  }
  .jr-404 h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 32px;
    margin: 16px 0 12px;
    color: #2E2A26;
  }
  .jr-404 p {
    font-size: 16px;
    color: #5A544E;
    margin-bottom: 32px;
  }
  .jr-404 .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .jr-404 a.btn {
    display: inline-block;
    padding: 14px 28px;
    font-size: 16px;
    text-decoration: none;
    border: 1px solid #A64B2A;
    transition: background-color .2s ease, color .2s ease;
  }
  .jr-404 a.btn-primary {
    background: #A64B2A;
    color: #fff;
  }
  .jr-404 a.btn-primary:hover,
  .jr-404 a.btn-primary:focus {
    background: #7E3519;
    border-color: #7E3519;
  }
  .jr-404 a.btn-ghost {
    background: transparent;
    color: #A64B2A;
  }
  .jr-404 a.btn-ghost:hover,
  .jr-404 a.btn-ghost:focus {
    background: #A64B2A;
    color: #fff;
  }
  .jr-404 a:focus-visible {
    outline: 3px solid #B8893B;
    outline-offset: 2px;
  }
  .jr-404 .brand {
    margin-top: 40px;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #1F4D3A;
  }
</style>
</head>
<body>
  <main class="jr-404">
    <div class="code" aria-hidden="true">404</div>
    <h1>Halaman tidak ditemukan</h1>
    <p>Halaman yang kamu cari mungkin sudah dipindahkan atau belum ada. Coba mulai dari beranda atau hubungi kami langsung.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Kembali ke Beranda</a>
      <a class="btn btn-ghost" href="/kontak/">Hubungi Kami</a>
    </div>
    <div class="brand">Jatimulya Residence</div>
  </main>
</body>
</html>
